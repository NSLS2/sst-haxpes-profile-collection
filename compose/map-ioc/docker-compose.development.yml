# Mount this checkout over the baked-in profile, and install nbs-sim from a
# local checkout (by default nbs-sim) next to the other collection packages.
services:
  map-ioc:
    volumes:
      - ${BEAMLINE_PODS_DIR}:/home/xf07id1/.ipython/profile_collection
      - ${NBS_COLLECTION_PACKAGES}:/home/xf07id1/collection_packages
    working_dir: /home/xf07id1/.ipython/profile_collection
    environment:
      - NBS_MAP_IOC_SRC=/home/xf07id1/collection_packages/${NBS_MAP_IOC_CHECKOUT:-nbs-sim}
