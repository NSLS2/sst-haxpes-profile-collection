name: HAXPES Bluesky Profile Testing

on:
  pull_request:
  push:
    branches: [ "main", "master" ]
  workflow_run:
    workflows: [ "Build and Push HAXPES Container Images" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "NBS_IMAGE_TAG override (e.g. build, develop, latest, or a version)"
        required: false
        default: ""

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
    steps:
      - name: Checkout for path check
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Decide whether to test on this event
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          EVENT="${{ github.event_name }}"

          if [[ "${EVENT}" == "workflow_run" ]]; then
            if [[ "${{ github.event.workflow_run.conclusion }}" == "success" ]]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [[ "${EVENT}" != "push" ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Push to main: if image inputs changed, build-images runs and
          # workflow_run starts tests after it succeeds.
          BEFORE="${{ github.event.before }}"
          if [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]]; then
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "${BEFORE}" "${{ github.sha }}" \
            | grep -Eq '^(images/|pixi\.toml|pixi\.lock|docker-compose\.build\.yml|\.github/workflows/build-images\.yml)'; then
            echo "Image inputs changed; deferring tests until build-images completes."
            echo "run_tests=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi

  pods-smoke-test:
    needs: gate
    if: ${{ needs.gate.outputs.run_tests == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NBS_COLLECTION_PACKAGES: ${{ github.workspace }}/collection_packages
      NBS_PROFILE_USE_LOCKED_PACKAGES: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          cache: true
          environments: pods

      - name: Select image tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            TAG="sha-${{ github.event.workflow_run.head_sha }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if [[ "${{ github.head_ref }}" == "develop" || "${{ github.base_ref }}" == "develop" ]]; then
              TAG="develop"
            else
              TAG="build"
            fi
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            TAG="develop"
          else
            TAG="build"
          fi
          echo "NBS_IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Using NBS_IMAGE_TAG=${TAG}"

      - name: Pods CLI smoke test
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "${NBS_COLLECTION_PACKAGES}"

          pixi run -e pods pods -- --help
          pixi run -e pods podman-compose --version || true

          pixi run -e pods pods-list | tee pods-list.txt
          grep -q "Available services" pods-list.txt

      - name: Start bluesky-services
        shell: bash
        run: |
          set -euo pipefail

          podman --version
          podman info --debug || true

          pixi run -e pods pods-start bluesky-services

          for i in $(seq 1 60); do
            echo "wait_iter=${i}"
            timeout 10s podman ps --format '{{.Names}}' | tee podman-ps.txt
            if grep -q "bluesky-services_mongo" podman-ps.txt && grep -q "bluesky-services_kafka" podman-ps.txt; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for bluesky-services to be running." >&2
          podman ps -a || true
          podman logs --tail 200 $(podman ps -aq) || true
          exit 1

      - name: Start ADSim
        shell: bash
        run: |
          set -euo pipefail

          pixi run -e pods pods-start adsim

          for _ in $(seq 1 60); do
            timeout 10s podman ps --format '{{.Names}}' | tee podman-ps.txt
            if grep -q "adsim" podman-ps.txt; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for ADSim to be running." >&2
          podman ps -a || true
          podman logs --tail 200 $(podman ps -aq) || true
          exit 1

      - name: Start sim
        shell: bash
        run: |
          set -euo pipefail

          pixi run -e pods pods-start --dev sim

          for _ in $(seq 1 60); do
            timeout 10s podman ps --format '{{.Names}}' | tee podman-ps.txt
            if grep -q "sim_sim" podman-ps.txt; then
              exit 0
            fi
            sleep 2
          done

          echo "Timed out waiting for sim to be running." >&2
          podman ps -a || true
          podman logs --tail 200 $(podman ps -aq) || true
          exit 1

      - name: Start queueserver test
        shell: bash
        run: |
          set -euo pipefail

          pixi run -e pods pods-start --dev --teardown --test queueserver

      - name: Tear down minimal pods
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          pixi run -e pods pods-stop queueserver sim bluesky-services || true
          podman ps -a || true
